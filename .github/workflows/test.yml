name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  skill-tests:
    name: Skill tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Hyperlift skill tests
        run: python -m unittest discover -s skills/hyperlift/tests -v
      - name: Validate skill metadata
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          for skill_md in pathlib.Path("skills").glob("*/SKILL.md"):
              text = skill_md.read_text()
              match = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              assert match, f"{skill_md}: missing frontmatter"
              front = match.group(1)
              assert re.search(r"^name:\s*\S+", front, re.M), f"{skill_md}: missing name"
              assert re.search(r"^description:\s*\S+", front, re.M), f"{skill_md}: missing description"
              print(f"ok: {skill_md}")
          EOF
