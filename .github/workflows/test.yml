name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  skill-tests:
    name: Skill tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Hyperlift skill tests
        run: python -m unittest discover -s skills/hyperlift/tests -v
      - name: Validate skills against the Agent Skills spec
        run: |
          for skill in skills/*/; do npx -y skills-ref validate "$skill"; done
